name: Release develop to main when Dependabot is clear

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Only one release run at a time; queued runs wait rather than cancel.
concurrency:
  group: release-develop-to-main
  cancel-in-progress: false

jobs:
  # The merge to main (made with RELEASE_PAT) triggers vercel-prod.yaml on
  # push, which deploys the merged main commit. There is no deploy job here.
  release:
    if: |
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true && github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PAT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_PAT }}

      - name: Count open Dependabot PRs
        id: dependabot
        run: |
          count=$(gh pr list --state open --author "dependabot[bot]" --json number --jq 'length')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Pin develop head commit
        id: develop
        if: steps.dependabot.outputs.count == '0'
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/develop" --jq '.commit.sha')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check if develop is ahead of main
        id: compare
        if: steps.dependabot.outputs.count == '0'
        env:
          DEVELOP_SHA: ${{ steps.develop.outputs.sha }}
        run: |
          ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$DEVELOP_SHA" --jq '.ahead_by')
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"

      - name: Verify changes are only package files
        id: package_changes
        if: steps.dependabot.outputs.count == '0' && steps.compare.outputs.ahead != '0'
        env:
          DEVELOP_SHA: ${{ steps.develop.outputs.sha }}
        run: |
          files_json=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$DEVELOP_SHA" --jq '[.files[].filename]')
          file_count=$(echo "$files_json" | jq 'length')
          allowed_only=$(echo "$files_json" | jq -r 'all(.[]; . == "package.json" or . == "package-lock.json")')
          if [[ "$file_count" -gt 0 && "$allowed_only" == "true" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find or create release PR
        id: release_pr
        if: steps.dependabot.outputs.count == '0' && steps.compare.outputs.ahead != '0' && steps.package_changes.outputs.allowed == 'true'
        run: |
          pr_number=$(gh pr list --state open --base main --head develop --json number --jq '.[0].number')
          if [[ -z "$pr_number" || "$pr_number" == "null" ]]; then
            pr_url=$(gh pr create --base main --head develop \
              --title "Release: develop → main" \
              --body "Automated release PR opened because no Dependabot PRs are pending.")
            pr_number=$(gh pr view "$pr_url" --json number --jq '.number')
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge for the verified commit
        if: steps.release_pr.outputs.number != ''
        env:
          PR_NUMBER: ${{ steps.release_pr.outputs.number }}
          DEVELOP_SHA: ${{ steps.develop.outputs.sha }}
        # --match-head-commit refuses the merge if develop moved after the
        # package-only check, so only the verified commit can reach main.
        run: gh pr merge --auto --merge --match-head-commit "$DEVELOP_SHA" "$PR_NUMBER"
